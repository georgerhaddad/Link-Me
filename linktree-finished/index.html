<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Hi! Gray text like this is a COMMENT. It's a note for humans. The browser ignores it. -->

    <!-- The <head> holds info ABOUT the page. You won't see most of it on screen. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The text that shows up on the browser tab -->
    <title>Alex Rivera | Links</title>

    <!-- This line connects style.css (how the page LOOKS) to this page -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- The <body> holds everything you SEE on the page -->

    <main class="card">

      <!-- Profile picture -->
      <img class="avatar" src="profile.svg" alt="Profile picture of Alex">

      <!-- Name -->
      <h1>Alex Rivera</h1>

      <!-- Bio -->
      <p class="bio">CS student · coffee enthusiast · building cool stuff on the internet</p>

      <!-- Links -->
      <nav class="links">
        <a class="link" href="https://github.com">💻 GitHub</a>
        <a class="link" href="https://linkedin.com">💼 LinkedIn</a>
        <a class="link" href="https://instagram.com">📸 Instagram</a>
        <a class="link" href="https://open.spotify.com">🎧 My Study Playlist</a>
        <a class="link" href="mailto:alex@example.com">✉️ Email Me</a>
      </nav>

      <footer>Made with HTML and CSS</footer>

    </main>
  </body>
</html>
