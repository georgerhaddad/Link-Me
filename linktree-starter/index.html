<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Hi! Gray text like this is a COMMENT. It's a note for humans. The browser ignores it. -->

    <!-- The <head> holds info ABOUT the page. You won't see most of it on screen. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✏️ STEP 1: The text that shows up on the browser tab -->
    <title>Your Name | Links</title>

    <!-- This line connects style.css (how the page LOOKS) to this page -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- The <body> holds everything you SEE on the page -->

    <main class="card">

      <!-- ✏️ STEP 3: Your profile picture.
           Put your photo in this folder, then change src="..." to its exact file name. -->
      <img class="avatar" src="profile.svg" alt="Profile picture">

      <!-- ✏️ STEP 1: Your name -->
      <h1>Your Name</h1>

      <!-- ✏️ STEP 1: A short bio -->
      <p class="bio">A short sentence about who you are.</p>

      <!-- ✏️ STEP 2: Your links.
           href="..." is where the link goes. The text between the tags is what people see.
           To add another link, copy a whole line and paste it below. -->
      <nav class="links">
        <a class="link" href="https://github.com">💻 GitHub</a>
        <a class="link" href="https://linkedin.com">💼 LinkedIn</a>
        <a class="link" href="https://instagram.com">📸 Instagram</a>
      </nav>

      <footer>Made with HTML and CSS</footer>

    </main>
  </body>
</html>
